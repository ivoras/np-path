<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1614">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>THE PATH</title>
<meta name="description" content="A walking simulator adapted from THE PATH by TLLOA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── gate ─────────────────────────────────────────────────────── -->
<div id="gate" class="layer">
  <div class="gate-inner">
    <div class="gate-mark">TLLOA</div>
    <h1 class="gate-title">THE PATH</h1>
    <p class="gate-sub">…</p>
    <form id="gate-form" autocomplete="off">
      <input id="gate-input" type="password" placeholder="" aria-label="password"
             spellcheck="false" autocomplete="off" autocapitalize="off" enterkeyhint="go">
      <button type="submit" id="gate-go">enter</button>
    </form>
    <p id="gate-err" class="gate-err">&nbsp;</p>
  </div>
</div>

<!-- ── title + main menu ────────────────────────────────────────── -->
<div id="title" class="layer hidden">
  <canvas id="cover"></canvas>
  <div class="title-inner">
    <div class="t-mark">TLLOA</div>
    <h1 class="t-title">THE PATH</h1>
  </div>
  <div id="menu-root"></div>
</div>

<!-- ── game ─────────────────────────────────────────────────────── -->
<canvas id="scene"></canvas>

<div id="hud" class="hidden">
  <div id="vo"></div>
  <div id="card" class="hidden"></div>
  <div id="chapter-title" class="hidden"></div>
  <div id="hint"></div>
  <div id="flash"></div>
</div>

<!-- the virtual controller mounts here -->
<div id="touch-root"></div>

<!-- the pause menu mounts here -->
<div id="pause-root"></div>

<div id="rotate" class="hidden">
  <p>Turn the phone sideways.</p>
  <p class="dim">The path is wider than it is tall.</p>
</div>

<div id="loading" class="layer hidden"><span>…</span></div>

<noscript>
  <div class="layer"><div class="gate-inner"><h1 class="gate-title">THE PATH</h1>
  <p class="gate-sub">This requires JavaScript.</p></div></div>
</noscript>

<!-- three.js is vendored locally: no CDN dependency, works offline, and the
     page cannot break because someone else's host went down. -->
<script type="importmap">
{
  "imports": {
    "three": "./js/vendor/three.module.js",
    "three/addons/": "./js/vendor/"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
