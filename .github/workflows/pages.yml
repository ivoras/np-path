name: Deploy THE PATH to GitHub Pages

on:
  push:
    branches: [master, mvp1]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Requires Pages to be switched on once, by hand:
      #   Settings -> Pages -> Source: GitHub Actions
      # (enablement:true is deliberately not set — the Actions token on this
      # repo cannot create the Pages site, so it only fails louder and later.)
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
